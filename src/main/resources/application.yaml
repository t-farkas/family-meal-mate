server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:recipedb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml
  cache:
    type: simple
springdoc:
  swagger-ui:
    operations-sorter: method
open-api:
  version: 1.0
  title: Family Meal Mate API
  description: >
    REST API for managing households, family members, recipes, meal plans, 
    and shopping lists. Users can register, create households, add members, 
    plan meals, and generate shopping lists.

jwt:
  secret: S7$gV^9p4w!D@q2Jm#Tz8H%lR3uE&c1Y*K6nW0bF$P5sA9rQd
  expiration: 86400000

mealplan:
  max-favourites: 5
shoppinglist:
  max-aggregation-retries: 3